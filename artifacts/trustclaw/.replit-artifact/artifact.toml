kind = "web"
previewPath = "/"
title = "TrustClaw"
version = "1.0.0"
id = "artifacts/trustclaw"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20460

[services.development]
run = "pnpm --filter @workspace/trustclaw run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trustclaw", "run", "build" ]
publicDir = "artifacts/trustclaw/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20460"
BASE_PATH = "/"
